<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Төрсөн өдрийн мэнд хүргэе!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7EC;
    --sky:#8FD3E8;
    --sky-deep:#5CB6D6;
    --grass:#8CBF6B;
    --grass-deep:#6FA750;
    --sun:#FFC93C;
    --coral:#E8563F;
    --pink:#F2A6C9;
    --navy:#2C3B41;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Nunito',sans-serif;
    color:var(--navy);
    background:var(--cream);
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2',cursive;
    margin:0;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 55%, var(--grass) 56%, var(--grass-deep) 100%);
    overflow:hidden;
    padding:2rem 1.2rem 6rem;
  }
  .sun{
    position:absolute;
    top:6%; right:10%;
    width:110px; height:110px;
    background:var(--sun);
    border-radius:50%;
    box-shadow:0 0 0 14px rgba(255,201,60,0.35);
    animation:pulse 4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }
  .hill{
    position:absolute;
    bottom:12%;
    width:220%;
    left:-60%;
    height:220px;
    background:var(--grass-deep);
    border-radius:50%;
    opacity:.55;
  }
  .cloud{
    position:absolute;
    background:#fff;
    border-radius:50px;
    opacity:.9;
    filter:blur(0.5px);
  }
  .cloud::before,.cloud::after{
    content:"";
    position:absolute;
    background:#fff;
    border-radius:50%;
  }
  .balloon{
    position:absolute;
    width:46px;
    height:58px;
    border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
    bottom:-120px;
    animation:float linear infinite;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,0.15));
  }
  .balloon::after{
    content:"";
    position:absolute;
    bottom:-26px; left:50%;
    width:2px; height:26px;
    background:rgba(44,59,65,0.4);
    transform:translateX(-50%);
  }
  @keyframes float{
    0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0;}
    5%{opacity:1;}
    50%{transform:translateY(-55vh) translateX(20px) rotate(6deg);}
    95%{opacity:1;}
    100%{transform:translateY(-115vh) translateX(-15px) rotate(-6deg); opacity:0;}
  }
  .eyebrow{
    font-family:'Nunito',sans-serif;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:.85rem;
    color:var(--white);
    background:rgba(44,59,65,0.25);
    padding:.4rem 1rem;
    border-radius:999px;
    margin-bottom:1.4rem;
    z-index:2;
  }
  .hero h1{
    font-size:clamp(2.4rem, 8vw, 5rem);
    color:var(--white);
    text-shadow:0 4px 0 rgba(44,59,65,0.18);
    line-height:1.05;
    z-index:2;
    max-width:16ch;
  }
  .hero h1 span{
    color:var(--sun);
    -webkit-text-stroke:2px var(--navy);
  }
  .hero p.sub{
    z-index:2;
    margin-top:1.2rem;
    font-size:clamp(1rem,2.6vw,1.3rem);
    font-weight:600;
    color:var(--navy);
    background:rgba(255,255,255,0.75);
    padding:.6rem 1.4rem;
    border-radius:999px;
  }
  .scroll-cue{
    z-index:2;
    margin-top:2.6rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.4rem;
    color:var(--navy);
    font-weight:700;
    font-size:.9rem;
    animation:bob 1.8s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(8px);}
  }
  .scroll-cue svg{width:22px;height:22px;}

  /* ---------- SECTION SHELL ---------- */
  section{
    padding:5rem 1.4rem;
    max-width:980px;
    margin:0 auto;
  }
  .section-title{
    text-align:center;
    font-size:clamp(1.8rem,5vw,2.6rem);
    color:var(--coral);
    margin-bottom:.6rem;
  }
  .section-sub{
    text-align:center;
    font-weight:600;
    color:var(--navy);
    opacity:.7;
    margin-bottom:3rem;
    font-size:1.05rem;
  }

  /* ---------- GALLERY ---------- */
  .gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2.2rem 1.6rem;
    align-items:start;
  }
  .polaroid{
    background:var(--white);
    padding:.7rem .7rem 1.4rem;
    border-radius:8px;
    box-shadow:0 12px 24px rgba(44,59,65,0.16);
    transform:rotate(var(--r));
    transition:transform .35s ease, box-shadow .35s ease;
  }
  .polaroid:hover{
    transform:rotate(0deg) translateY(-6px) scale(1.03);
    box-shadow:0 18px 30px rgba(44,59,65,0.22);
  }
  .polaroid img{
    width:100%;
    display:block;
    border-radius:3px;
    aspect-ratio:4/5;
    object-fit:cover;
  }
  .polaroid figcaption{
    text-align:center;
    font-family:'Baloo 2',cursive;
    color:var(--navy);
    margin-top:.7rem;
    font-size:1.05rem;
  }
  .p1{--r:-6deg;}
  .p2{--r:4deg; margin-top:2.2rem;}
  .p3{--r:-3deg;}

  @media (max-width:720px){
    .gallery{grid-template-columns:1fr; max-width:340px; margin-inline:auto;}
    .p2{margin-top:0;}
  }

  /* ---------- MESSAGE ---------- */
  .message-wrap{
    background:var(--white);
    border-radius:28px;
    padding:3rem 2rem;
    box-shadow:0 14px 30px rgba(44,59,65,0.1);
    position:relative;
  }
  .message-wrap::before{
    content:"🎈";
    position:absolute;
    top:-22px; left:24px;
    font-size:2.4rem;
    transform:rotate(-10deg);
  }
  .message-wrap::after{
    content:"🎈";
    position:absolute;
    top:-18px; right:26px;
    font-size:2rem;
    transform:rotate(12deg);
  }
  .message-wrap p{
    font-size:1.15rem;
    line-height:1.85;
    font-weight:600;
    margin-bottom:1.2rem;
  }
  .signoff{
    text-align:right;
    font-family:'Baloo 2',cursive;
    color:var(--coral);
    font-size:1.3rem;
  }

  /* ---------- CAKE (SIGNATURE) ---------- */
  .cake-section{
    text-align:center;
  }
  .cake-hint{
    font-weight:700;
    color:var(--navy);
    opacity:.65;
    margin-bottom:2.2rem;
  }
  .cake-stage{
    position:relative;
    display:inline-block;
    padding-top:70px;
  }
  .cake{
    width:260px;
  }
  .candle-group{
    position:absolute;
    top:0;
    display:flex;
    gap:26px;
    left:50%;
    transform:translateX(-50%);
  }
  .candle{
    width:10px;
    height:44px;
    background:linear-gradient(180deg,#FFD9A0,#F2A6C9);
    border-radius:4px;
    position:relative;
    cursor:pointer;
  }
  .flame{
    position:absolute;
    top:-22px;
    left:50%;
    transform:translateX(-50%);
    width:16px;
    height:24px;
    background:radial-gradient(circle at 50% 70%, #FFEB94, var(--sun) 60%, var(--coral) 100%);
    border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;
    animation:flicker 1.1s ease-in-out infinite;
    transform-origin:bottom center;
    transition:opacity .25s ease, transform .25s ease;
  }
  @keyframes flicker{
    0%,100%{transform:translateX(-50%) scale(1) rotate(-2deg);}
    50%{transform:translateX(-50%) scale(1.08) rotate(3deg);}
  }
  .candle.out .flame{
    opacity:0;
    transform:translateX(-50%) scale(0.2);
  }
  .smoke{
    position:absolute;
    top:-24px;
    left:50%;
    width:6px;
    height:6px;
    border-radius:50%;
    background:rgba(150,150,150,0.5);
    opacity:0;
    pointer-events:none;
  }
  .candle.out .smoke{
    animation:smokeUp 1.4s ease-out forwards;
  }
  @keyframes smokeUp{
    0%{opacity:.6; transform:translate(-50%,0) scale(1);}
    100%{opacity:0; transform:translate(-30%,-40px) scale(3);}
  }
  .cake-caption{
    margin-top:1.6rem;
    font-family:'Baloo 2',cursive;
    font-size:1.15rem;
    color:var(--coral);
    min-height:1.6em;
  }
  .confetti-piece{
    position:fixed;
    top:-10px;
    width:9px;
    height:14px;
    z-index:50;
    opacity:.95;
    pointer-events:none;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{
      transform:translateY(100vh) rotate(540deg);
      opacity:.2;
    }
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    padding:3.5rem 1.4rem 3rem;
    background:var(--navy);
    color:var(--cream);
  }
  footer .display{
    font-size:1.6rem;
    color:var(--sun);
    margin-bottom:.6rem;
  }
  footer p{
    opacity:.75;
    font-weight:600;
    font-size:.95rem;
  }
</style>
</head>
<body>

<section class="hero">
  <div class="cloud" style="width:90px;height:34px;top:14%;left:8%;"></div>
  <div class="cloud" style="width:70px;height:26px;top:22%;left:22%;"></div>
  <div class="sun"></div>
  <div class="hill"></div>

  <div class="balloon" style="left:12%; background:var(--coral); animation-duration:11s; animation-delay:0s;"></div>
  <div class="balloon" style="left:26%; background:var(--sun); animation-duration:13s; animation-delay:1.4s;"></div>
  <div class="balloon" style="left:68%; background:var(--pink); animation-duration:12s; animation-delay:2.6s;"></div>
  <div class="balloon" style="left:82%; background:var(--white); animation-duration:14s; animation-delay:.7s;"></div>
  <div class="balloon" style="left:46%; background:var(--pink); animation-duration:10s; animation-delay:3.5s;"></div>

  <p class="eyebrow">7 сарын 6</p>
  <h1>Төрсөн өдрийн<br>мэнд хүргэе, <span>дүү минь</span>!</h1>

<section class="message-section">
  <div class="message-wrap">
    <p class="signoff">Охин дүүдээ төрсөн өдрийн мэндийг хүргэе</p>
  </div>
</section>

<section class="cake-section">
  <h2 class="section-title">Лаагаа унтраана уу! 🕯️</h2>
  <p class="cake-hint">Лаа бүр дээр дараад, хүслээ хүс</p>
  <div class="cake-stage">
    <div class="candle-group" id="candles">
      <div class="candle" data-c="0"><div class="flame"></div><div class="smoke"></div></div>
      <div class="candle" data-c="1"><div class="flame"></div><div class="smoke"></div></div>
      <div class="candle" data-c="2"><div class="flame"></div><div class="smoke"></div></div>
    </div>
    <svg class="cake" viewBox="0 0 260 190" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="130" cy="178" rx="118" ry="10" fill="#2C3B41" opacity="0.08"/>
      <rect x="20" y="110" width="220" height="60" rx="14" fill="#E8563F"/>
      <rect x="20" y="110" width="220" height="16" rx="8" fill="#F2A6C9"/>
      <rect x="40" y="60" width="180" height="55" rx="14" fill="#FFC93C"/>
      <rect x="40" y="60" width="180" height="14" rx="7" fill="#FFF3C4"/>
      <circle cx="70" cy="108" r="7" fill="#E8563F"/>
      <circle cx="105" cy="108" r="7" fill="#8FD3E8"/>
      <circle cx="140" cy="108" r="7" fill="#F2A6C9"/>
      <circle cx="175" cy="108" r="7" fill="#8CBF6B"/>
      <circle cx="205" cy="108" r="7" fill="#E8563F"/>
    </svg>
  </div>
  <p class="cake-caption" id="cakeCaption"></p>
</section>

<footer>
  <div class="display">Баяр хүргэе! 🎉</div>
  
</footer>

<script>
  const candles = document.querySelectorAll('.candle');
  const caption = document.getElementById('cakeCaption');
  const messages = [
    'Нэг лаа унтарлаа... хүсэл шивнэсэн үү? 😊',
    'Хоёр дахь лаа унтарлаа! 2🎈',
    'Бүх лаа унтарлаа! Хүсэл чинь биелэх болтугай ✨🎂'
  ];
  let outCount = 0;

  function burstConfetti(x, y){
    const colors = ['#E8563F','#FFC93C','#8FD3E8','#8CBF6B','#F2A6C9'];
    for(let i=0;i<26;i++){
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = (x + (Math.random()*60-30)) + 'px';
      p.style.top = (y) + 'px';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
      p.style.transform = `rotate(${Math.random()*360}deg)`;
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 3000);
    }
  }

  candles.forEach((c) => {
    c.addEventListener('click', () => {
      if(c.classList.contains('out')) return;
      c.classList.add('out');
      outCount++;
      const rect = c.getBoundingClientRect();
      burstConfetti(rect.left + rect.width/2, rect.top);
      caption.textContent = messages[Math.min(outCount-1, messages.length-1)];
      if(outCount === candles.length){
        setTimeout(()=>{
          const stage = document.querySelector('.cake-stage').getBoundingClientRect();
          burstConfetti(stage.left + stage.width/2, stage.top + 40);
        }, 300);
      }
    });
  });
</script>

</body>
